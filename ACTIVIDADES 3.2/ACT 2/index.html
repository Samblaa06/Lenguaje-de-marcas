<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario con estados</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h2>Formulario de Alta de Usuario</h2>

  <form>
    <div>
      <label for="id_usuario">ID Usuario:</label>
      <input type="text" id="id_usuario" value="USR-2026-99" readonly>
    </div>

    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" required>
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" required>
    </div>

    <div>
      <label for="password">Contraseña:</label>
      <input type="password" id="password" required>
    </div>

    <div>
      <label for="promo">Código promocional:</label>
      <input type="text" id="promo" value="NO-DISPONIBLE" disabled>
    </div>

    <fieldset>
      <legend>Sexo</legend>
      <input type="radio" id="hombre" name="sexo" value="H">
      <label for="hombre">Hombre</label>

      <input type="radio" id="mujer" name="sexo" value="M">
      <label for="mujer">Mujer</label>
    </fieldset>

    <fieldset>
      <legend>Aficiones</legend>
      <input type="checkbox" id="deporte" name="aficion">
      <label for="deporte">Deporte</label>

      <input type="checkbox" id="lectura" name="aficion">
      <label for="lectura">Lectura</label>
    </fieldset>

    <button type="submit">Registrar</button>
  </form>

</body>
</html>
