<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Producto Refactorizada</title>
  <link rel="stylesheet" href="estilos_refactor.css">
</head>
<body>
  <main class="contenedor">
    <article class="tarjeta-producto">
      <img src="https://via.placeholder.com/300x200" alt="Auriculares Inalámbricos" class="producto-img">
      
      <div class="producto-info">
        <h2 class="producto-titulo">Auriculares Pro Wireless</h2>
        <p class="producto-descripcion">Cancelación de ruido activa, conectividad Bluetooth 5.3 y hasta 30 horas de autonomía.</p>
        
        <div class="precio-caja">
          <span class="producto-precio">79,99 €</span>
          <span class="precio-antiguo">119,99 €</span>
        </div>

        <button type="button" class="btn-comprar">Añadir al carrito</button>
      </div>
    </article>
  </main>
</body>
</html>
