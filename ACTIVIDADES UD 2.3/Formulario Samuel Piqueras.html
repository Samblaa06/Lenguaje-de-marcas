<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de alta de usuario</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="formulario">
    <h2>Formulario de alta de usuario</h2>
    <form action="http://172.30.18.224:3000/" method="POST">
      <div class="form-group full-width">
        <label for="id_usuario">Identificador de nuevo usuario</label>
        <input type="text" id="id_usuario" name="id_usuario" value="usu_012345" readonly title="Identificador de usuario único (Solo lectura)">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>

          <input type="text" id="nombre" name="nombre" required title="Introduce tu nombre">
        </div>
        <div class="form-group">
          <label for="apellidos">Apellidos</label>

          <input type="text" id="apellidos" name="apellidos" required title="Introduce tus apellidos">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">

          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required title="Introduce tu contraseña">
        </div>
        <div class="form-group">

          <label for="confirm_password">Confirmar contraseña</label>
          <input type="password" id="confirm_password" name="confirm_password" required title="Vuelve a escribir tu contraseña">
        </div>
      </div>
      <div class="form-group full-width">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required title="Introduce tu correo electrónico">
      </div>
      <div class="form-group full-width">

        <label>Sexo</label>
        <div class="options-inline">
          <label title="Seleccionar sexo masculino">
            <input type="radio" name="sexo" value="Hombre"> Hombre
          </label>
          <label title="Seleccionar sexo femenino">
            <input type="radio" name="sexo" value="Mujer" checked> Mujer
          </label>
        </div>
      </div>
      <div class="form-group full-width">

        <label>Aficiones</label>
        <div class="options-inline">
          <label title="Deportes">
            <input type="checkbox" name="aficiones[]" value="Deportes"> Deportes
          </label>
          <label title="Lectura">
            <input type="checkbox" name="aficiones[]" value="Lectura" checked> Lectura
          </label>
          <label title="Cine">
            <input type="checkbox" name="aficiones[]" value="Cine"> Cine
          </label>
        </div>
      </div>
      <div class="form-group full-width">
        <label for="pais">País</label>
        <select id="pais" name="pais" title="Selecciona tu país de residencia">
          <option value="España" selected>España</option>
          <option value="Francia">Francia</option>
          <option value="Portugal">Portugal</option>
        </select>
      </div>
      <div class="form-group full-width">
        <label for="foto">Subir su foto</label>
        <input type="file" id="foto" name="foto" title="Selecciona una foto de perfil">
      </div>
      <div class="form-group full-width">
        <label for="comentarios">Comentarios personales</label>
        <textarea id="comentarios" name="comentarios" cols="40" rows="5" placeholder="Escriba aquí sus comentarios" title="Escribe cualquier comentario adicional"></textarea>
      </div>
      <div class="actions">
        <button type="reset" class="btn btn-reset" title="Reiniciar todos los campos del formulario">Resetear</button>
        <button type="submit" class="btn btn-submit" title="Enviar formulario de registro">Enviar</button>
      </div>
    </form>
  </div>
</body>
</html>
